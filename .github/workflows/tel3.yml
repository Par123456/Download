name: 📥 Telegram Scraper (No API)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کانال (بدون @)'
        required: true
        type: string
      count:
        description: 'تعداد آخرین پست‌ها'
        required: true
        default: '5'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30               # 👈 زمان کافی برای ۲۰-۳۰ پست
    permissions:
      contents: write
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: نصب نیازمندی‌ها
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip
          pip3 install requests beautifulsoup4 html2text

      - name: تست دسترسی به کانال
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          CHANNEL=$(echo "$CHANNEL" | sed 's/@//g' | sed 's|https://t.me/s/||g' | sed 's|https://t.me/||g' | tr -d '/')
          URL="https://t.me/s/$CHANNEL"
          echo "🔍 تست اتصال به $URL"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L --max-time 15 -A "Mozilla/5.0" "$URL")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ کانال در دسترس نیست (کد $STATUS)."
            echo "خطا: کد $STATUS برای $URL" > error.log
          else
            echo "✅ کانال در دسترس است."
          fi

      - name: ساخت اسکریپت پایتون
        run: |
          cat > scrape.py << 'EOF'
          import os, sys, re, time, traceback
          from datetime import datetime, timezone
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          import html2text

          ERROR_LOG = Path("error.log")

          def log_error(msg):
              ERROR_LOG.write_text(msg, encoding='utf-8')

          try:
              channel_raw = os.environ['CHANNEL'].strip()
              channel = channel_raw.replace('@','').replace('https://t.me/s/','').replace('https://t.me/','').rstrip('/')
              count_raw = os.environ.get('COUNT', '5')
              try:
                  count = int(count_raw)
              except:
                  count = 5
              repo_owner = os.environ['REPO_OWNER']
              repo_name = os.environ['REPO_NAME']
              branch = os.environ['BRANCH']

              BASE_URL = f"https://t.me/s/{channel}"
              TEL_ROOT = Path('downloads/tel') / channel
              TEL_ROOT.mkdir(parents=True, exist_ok=True)

              HEADERS = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              }

              print(f"📡 کانال: @{channel} | تعداد درخواستی: {count}")

              # تست اتصال اولیه
              for attempt in range(3):
                  try:
                      resp = requests.get(BASE_URL, headers=HEADERS, timeout=20)
                      if resp.status_code == 200:
                          break
                      print(f"   تلاش {attempt+1}: HTTP {resp.status_code}")
                  except Exception as e:
                      print(f"   تلاش {attempt+1}: {e}")
                  time.sleep(5)
              else:
                  raise Exception("اتصال به کانال پس از ۳ تلاش ناموفق ماند")

              messages = []
              last_id = None
              need = count

              while need > 0:
                  url = BASE_URL if not last_id else f"{BASE_URL}?before={last_id}"
                  print(f"   🔗 {url}")
                  try:
                      resp = requests.get(url, headers=HEADERS, timeout=20)
                      if resp.status_code != 200:
                          print(f"   ⚠️ HTTP {resp.status_code}")
                          break
                  except Exception as e:
                      print(f"   ❌ خطا در دریافت: {e}")
                      break

                  soup = BeautifulSoup(resp.text, 'html.parser')
                  wraps = soup.select('.tgme_widget_message_wrap')
                  if not wraps:
                      print("   🚫 پست دیگری یافت نشد")
                      break

                  new_posts = 0
                  for wrap in wraps:
                      if need <= 0:
                          break
                      msg = wrap.select_one('.tgme_widget_message')
                      if not msg:
                          continue
                      data_post = msg.get('data-post', '')
                      if not data_post:
                          continue
                      mid = data_post.split('/')[-1]
                      try:
                          last_id = int(mid)
                      except:
                          continue

                      text_div = msg.select_one('.tgme_widget_message_text')
                      text = ''
                      if text_div:
                          h = html2text.HTML2Text()
                          h.ignore_links = False
                          h.ignore_images = True
                          text = h.handle(str(text_div)).strip()

                      time_tag = msg.select_one('.tgme_widget_message_date time')
                      if time_tag and time_tag.has_attr('datetime'):
                          date_str = time_tag['datetime']
                      else:
                          date_str = datetime.now(timezone.utc).isoformat()

                      media = []
                      for p in msg.select('.tgme_widget_message_photo_wrap'):
                          m = re.search(r"url\(['\"]?(.*?)['\"]?\)", p.get('style',''))
                          if m:
                              media.append(('photo', m.group(1)))
                      for v in msg.select('.tgme_widget_message_video'):
                          src = v.get('src') or v.get('data-src')
                          if src:
                              media.append(('video', src))
                      for d in msg.select('.tgme_widget_message_document'):
                          classes = d.get('class', [])
                          dtype = 'document'
                          if 'message_voice' in classes: dtype = 'voice'
                          elif 'message_audio' in classes: dtype = 'audio'
                          elif 'message_sticker' in classes: dtype = 'sticker'
                          a = d.select_one('a')
                          href = a.get('href') if a else ''
                          if href.startswith('/'):
                              href = f'https://t.me{href}'
                          media.append((dtype, href if href.startswith('http') else None))
                      for s in msg.select('.tgme_widget_message_sticker img'):
                          src = s.get('src')
                          if src:
                              media.append(('sticker', src))

                      messages.append({'id': mid, 'date': date_str, 'text': text, 'media': media})
                      need -= 1
                      new_posts += 1

                  print(f"   📋 این صفحه: {new_posts} پست جدید")
                  # اگر هیچ پست جدیدی اضافه نشد، از حلقه خارج شو
                  if new_posts == 0:
                      print("   ℹ️ پست جدیدی یافت نشد، توقف")
                      break

                  if len(wraps) < 20:
                      break
                  time.sleep(0.8)

              print(f"✅ مجموعاً {len(messages)} پست اسکرپ شد")
              if not messages:
                  raise Exception("هیچ پستی پیدا نشد")

              post_folders = []
              posts_for_html = []

              for msg in messages:
                  try:
                      d = msg['date'].replace('Z', '+00:00')
                      dt = datetime.fromisoformat(d)
                  except:
                      dt = datetime.now(timezone.utc)
                  folder_name = f"{dt.strftime('%Y-%m-%d_%H%M%S')}_{msg['id']}"
                  fpath = TEL_ROOT / folder_name
                  fpath.mkdir(parents=True, exist_ok=True)
                  post_folders.append(folder_name)
                  print(f"\n📌 پست {msg['id']} → {folder_name}")

                  files = []
                  media_html_list = []
                  for idx, (mtype, url) in enumerate(msg['media'], 1):
                      if not url or not url.startswith('http'):
                          files.append((mtype, None, 'لینک ندارد'))
                          continue
                      ext = {'photo':'.jpg','video':'.mp4','sticker':'.webp','voice':'.ogg','audio':'.mp3'}.get(mtype,'.dat')
                      if mtype == 'document':
                          ext = os.path.splitext(url.split('?')[0])[1] or '.dat'
                      fname = f"{mtype}_{idx}{ext}"
                      print(f"   ⬇️ {mtype}: {fname} ...", end='', flush=True)
                      # چند بار تلاش
                      downloaded = False
                      for attempt in range(3):
                          try:
                              r = requests.get(url, headers=HEADERS, timeout=60)
                              if r.status_code == 200 and r.content:
                                  (fpath / fname).write_bytes(r.content)
                                  sz = len(r.content)//1024
                                  files.append((mtype, fname, f"{sz} KB"))
                                  print(f"✅ {sz} KB")
                                  rel = f"{folder_name}/{fname}"
                                  if mtype == 'photo': media_html_list.append(f'<img src="{rel}" class="msg-photo" loading="lazy">')
                                  elif mtype == 'video': media_html_list.append(f'<video controls class="msg-video"><source src="{rel}"></video>')
                                  elif mtype in ('audio','voice'): media_html_list.append(f'<audio controls src="{rel}"></audio>')
                                  elif mtype == 'sticker': media_html_list.append(f'<img src="{rel}" class="msg-sticker" loading="lazy">')
                                  else: media_html_list.append(f'<a href="{rel}" class="msg-doc">📄 {fname} ({sz} KB)</a>')
                                  downloaded = True
                                  break
                              else:
                                  if attempt < 2:
                                      print(f"⚠️ HTTP {r.status_code}, تلاش مجدد...", end='')
                                      time.sleep(3)
                                  else:
                                      files.append((mtype, None, f"HTTP {r.status_code}"))
                                      print(f"⚠️ HTTP {r.status_code}")
                          except Exception as e:
                              if attempt < 2:
                                  print(f"❌ {e}, تلاش مجدد...", end='')
                                  time.sleep(3)
                              else:
                                  files.append((mtype, None, str(e)[:80]))
                                  print(f"❌ {e}")
                      if not downloaded:
                          time.sleep(0.4)
                      else:
                          time.sleep(0.2)

                  posts_for_html.append({'id':msg['id'],'date':msg['date'],'text':msg['text'],'media_html':media_html_list})

                  # README.md
                  lines = [f"# 📬 پست تلگرامی #{msg['id']}","",
                           "| مشخصات | مقدار |","|--------|--------|",
                           f"| تاریخ | {msg['date']} |",f"| کانال | @{channel} |",f"| شناسه | {msg['id']} |",""]
                  if msg['text']: lines += ["## ✍️ متن پیام","",msg['text'],""]
                  if files:
                      lines += ["## 📎 فایل‌های پیوست","","| نوع | نام فایل | حجم/وضعیت |","|-----|----------|-----------|"]
                      for mt,fn,st in files:
                          lines.append(f"| {mt} | [{fn}](./{fn}) | {st} |" if fn else f"| {mt} | — | {st} |")
                      lines.append("")
                  else: lines.append("## 📎 بدون فایل پیوست","")
                  lines += ["---","*اسکرپ شده توسط AnishtayiN*"]
                  (fpath / "README.md").write_text("\n".join(lines), encoding='utf-8')

              # chat.html
              posts_for_html.sort(key=lambda x: x['date'])
              def fmt(iso):
                  try: return datetime.fromisoformat(iso.replace('Z','+00:00')).strftime('%Y/%m/%d %H:%M')
                  except: return iso
              html = [f'<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>چت @{channel}</title><style>',
                      ':root{--bg:#0e1621;--msg-bg:#182533;--text:#f5f5f5;--accent:#2b5278;--border:#253044;--link:#6ab3f3}',
                      'body{margin:0;padding:0;font-family:Segoe UI,Tahoma;background:var(--bg);color:var(--text);direction:rtl}',
                      '.chat-container{max-width:700px;margin:20px auto;padding:20px 15px;display:flex;flex-direction:column;gap:18px}',
                      '.header{text-align:center;background:var(--msg-bg);padding:15px;border-radius:12px;border:1px solid var(--border)}',
                      '.message{display:flex;flex-direction:column;align-items:flex-end}',
                      '.bubble{background:var(--msg-bg);padding:12px 16px;border-radius:12px;max-width:80%;word-wrap:break-word;border:1px solid var(--border)}',
                      '.msg-date{font-size:.75rem;color:#7b8a9c;margin-top:6px}',
                      '.msg-text{line-height:1.6;white-space:pre-wrap}',
                      '.msg-photo,.msg-video{max-width:100%;border-radius:8px;margin-top:8px}',
                      '.msg-sticker{max-width:120px}',
                      '.msg-doc{display:inline-block;background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none;margin-top:8px}',
                      'a{color:var(--link)}', 'audio{margin-top:8px}',
                      '</style></head><body><div class="chat-container"><div class="header"><h2>📢 @',channel,'</h2><p>آخرین ',str(len(posts_for_html)),' پست</p></div>']
              for post in posts_for_html:
                  html.append('<div class="message"><div class="bubble">')
                  if post['text']:
                      safe = post['text'].replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('\n','<br>')
                      html.append(f'<div class="msg-text">{safe}</div>')
                  for mtag in post['media_html']:
                      html.append(mtag)
                  html.append('</div>')
                  html.append(f'<div class="msg-date">{fmt(post["date"])}</div></div>')
              html.append('</div></body></html>')
              chat_path = TEL_ROOT / 'chat.html'
              chat_path.write_text('\n'.join(html), encoding='utf-8')
              if not chat_path.exists():
                  raise FileNotFoundError("chat.html ساخته نشد")
              print(f"🎨 chat.html تولید شد")

              # README کانال
              idx = [f"# 📥 پست‌های کانال @{channel}","",f"**مشاهده چت:** [chat.html](chat.html)",""]
              for f in post_folders: idx.append(f"- [{f}](./{f})")
              idx += ["","---","*AnishtayiN Downloader*"]
              (TEL_ROOT / "README.md").write_text("\n".join(idx), encoding='utf-8')

              # README اصلی
              now_utc = datetime.now(timezone.utc).strftime('%Y/%m/%d %H:%M') + ' UTC'
              root = Path("README.md")
              if not root.exists(): root.write_text("# Telegram Scraper\n", encoding='utf-8')
              content = root.read_text(encoding='utf-8')
              sec = "📥 آخرین پست‌های دانلود شده از تلگرام"
              marker = f"## {sec}"
              clink = f"https://github.com/{repo_owner}/{repo_name}/tree/{branch}/downloads/tel/{channel}"
              if marker in content:
                  idx_m = content.index(marker)
                  rest = content[idx_m:]
                  nxt = rest.find("---", len(marker))
                  content = content[:idx_m] + (rest[nxt+3:] if nxt!=-1 else "")
              lines = [l for l in content.split('\n') if clink not in l]
              content = '\n'.join(lines).strip()
              entry = f"- [@{channel}]({clink}) ← 🕒 {now_utc} | [چت]({clink}/chat.html)"
              content += f"\n\n## {sec}\n\n{entry}\n\n---\n"
              root.write_text(content, encoding='utf-8')

              if ERROR_LOG.exists(): ERROR_LOG.unlink()
              print("\n🎉 موفقیت آمیز!")

          except Exception:
              err = traceback.format_exc()
              print("❌ خطا:\n", err)
              log_error(err)
              sys.exit(1)
          EOF

      - name: اجرای اسکریپت
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
          COUNT: ${{ github.event.inputs.count }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: python3 scrape.py

      - name: نمایش error.log در صورت وجود
        if: failure()
        run: |
          if [ -f error.log ]; then
            echo "📄 محتوای error.log:"
            cat error.log
          fi

      - name: commit و push
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md downloads/ error.log 2>/dev/null || true
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "چیزی برای commit وجود ندارد."
            exit 0
          fi
          git commit -m "📥 اسکرپ پست‌های تلگرام [skip ci]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin HEAD:${{ github.ref_name }}
        shell: bash
