name: 📥 YouTube Video Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube video URL'
        required: true
        type: string
      quality:
        description: 'Quality'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080p
          - 720p
          - 480p
          - 360p
          - audio-only

concurrency:
  group: youtube-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip ffmpeg python3 python3-pip

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download YouTube video
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          VIDEO_URL="$VIDEO_URL"
          QUALITY="$QUALITY"

          echo "Downloading: $VIDEO_URL"
          echo "Quality: $QUALITY"

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FOLDER="youtube-downloads/$TIMESTAMP"
          mkdir -p "$FOLDER"

          if [ "$QUALITY" = "audio-only" ]; then
            echo "Extracting audio only..."
            yt-dlp \
              --extract-audio \
              --audio-format mp3 \
              --audio-quality 0 \
              --output "$FOLDER/%(title)s.%(ext)s" \
              --no-playlist \
              --retries 5 \
              --fragment-retries 5 \
              "$VIDEO_URL" || { echo "Download failed"; exit 1; }
          else
            FORMAT_SELECTOR="bestvideo[height<=${QUALITY:-1080}]+bestaudio/best[height<=${QUALITY:-1080}]/best"
            echo "Format selector: $FORMAT_SELECTOR"
            yt-dlp \
              --format "$FORMAT_SELECTOR" \
              --merge-output-format mp4 \
              --output "$FOLDER/%(title)s.%(ext)s" \
              --no-playlist \
              --retries 5 \
              --fragment-retries 5 \
              "$VIDEO_URL" || { echo "Download failed"; exit 1; }
          fi

          echo "Download completed. Files:"
          ls -la "$FOLDER"

          SPLIT_THRESHOLD_MB=90
          SPLIT_THRESHOLD_BYTES=$(( SPLIT_THRESHOLD_MB * 1024 * 1024 ))

          for FILE in "$FOLDER"/*; do
            [ -f "$FILE" ] || continue
            SIZE=$(stat -c%s "$FILE")
            BASENAME=$(basename "$FILE")
            echo "File: $BASENAME, Size: $(( SIZE / 1024 / 1024 ))MB"

            if [ "$SIZE" -gt "$SPLIT_THRESHOLD_BYTES" ]; then
              echo "Splitting $BASENAME into ${SPLIT_THRESHOLD_MB}MB parts..."
              cd "$FOLDER"
              zip -0 -s "${SPLIT_THRESHOLD_MB}m" "${BASENAME}.zip" "$BASENAME"
              rm -f "$BASENAME"
              cd ../..
              echo "Split completed."
            fi
          done

          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Create README for download
        run: |
          TIMESTAMP="$TIMESTAMP"
          FOLDER="youtube-downloads/$TIMESTAMP"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"

          {
            echo "# 📥 دانلود از یوتیوب"
            echo ""
            echo "**تاریخ:** $(date '+%Y-%m-%d %H:%M:%S')"
            echo ""
            echo "**URL:** ${{ github.event.inputs.url }}"
            echo ""
            echo "**کیفیت:** ${{ github.event.inputs.quality }}"
            echo ""
            echo "---"
            echo ""
            echo "## فایل‌های دانلود شده"
            echo ""
            echo "| نام فایل | حجم | لینک |"
            echo "|----------|------|------|"
            for FILE in "$FOLDER"/*; do
              if [ -f "$FILE" ]; then
                BASENAME=$(basename "$FILE")
                SIZE=$(stat -c%s "$FILE")
                SIZE_MB=$(( SIZE / 1024 / 1024 ))
                ENCODED_FILE=$(echo "$BASENAME" | sed 's/ /%20/g')
                ENCODED_FOLDER=$(echo "$TIMESTAMP" | sed 's/ /%20/g')
                RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/youtube-downloads/${ENCODED_FOLDER}/${ENCODED_FILE}"
                echo "| \`$BASENAME\` | ${SIZE_MB} MB | [دانلود](${RAW_LINK}) |"
              fi
            done
            echo ""
            echo "---"
            echo "*دانلود خودکار با GitHub Actions*"
          } > "$FOLDER/README.md"

      - name: Update main README
        run: |
          TIMESTAMP="$TIMESTAMP"
          MAIN_README="youtube-downloads/README.md"

          {
            echo "# 📥 دانلودهای یوتیوب"
            echo ""
            echo "| تاریخ | پوشه |"
            echo "|--------|------|"
            for DIR in youtube-downloads/*/; do
              if [ -d "$DIR" ] && [ "${DIR:0:1}" != "." ]; then
                DIRNAME=$(basename "$DIR")
                echo "| $DIRNAME | [مشاهده](./$DIRNAME/) |"
              fi
            done
            echo ""
            echo "---"
            echo "*دانلود خودکار با GitHub Actions*"
          } > "$MAIN_README"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add youtube-downloads/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add YouTube download [skip ci]"
          git pull --rebase
          git push
