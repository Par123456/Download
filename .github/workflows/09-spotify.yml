name: 🎵 Music Downloader by Name

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Song name / artist'
        required: true
        type: string
      quality:
        description: 'Audio quality'
        required: false
        default: '320k'
        type: choice
        options:
          - 320k
          - 256k
          - 192k
          - 128k

concurrency:
  group: music-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip ffmpeg python3 python3-pip

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Search & Download Audio
        env:
          SEARCH_QUERY: ${{ github.event.inputs.query }}
          AUDIO_QUALITY: ${{ github.event.inputs.quality }}
        run: |
          echo "Searching & downloading: $SEARCH_QUERY"
          QUALITY="${AUDIO_QUALITY:-320k}"

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FOLDER="music-downloads/$TIMESTAMP"
          mkdir -p "$FOLDER"

          # Use yt-dlp built-in search: ytsearch1: means search YouTube, take the first result
          # Extract audio as mp3, embed thumbnail and metadata, best quality
          yt-dlp "ytsearch1:${SEARCH_QUERY}" \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            --embed-thumbnail \
            --add-metadata \
            --output "$FOLDER/%(title)s.%(ext)s" \
            --no-playlist \
            --retries 5 \
            --fragment-retries 5 \
            --no-warnings \
            || { echo "Download failed"; exit 1; }

          echo "Download finished. Listing files:"
          ls -la "$FOLDER"

          # Split if total size > 90 MB (rare for a single audio, but safe)
          SPLIT_MB=90
          SPLIT_BYTES=$(( SPLIT_MB * 1024 * 1024 ))
          TOTAL_SIZE=$(du -sb "$FOLDER" | cut -f1)
          if [ "$TOTAL_SIZE" -gt "$SPLIT_BYTES" ]; then
            echo "Size over ${SPLIT_MB}MB, creating split zip..."
            cd "$FOLDER"
            zip -0 -s "${SPLIT_MB}m" "archive.zip" *
            rm -f -- *.mp3 *.webm *.m4a 2>/dev/null || true
            cd ../..
          fi

          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Create README
        run: |
          TIMESTAMP="$TIMESTAMP"
          FOLDER="music-downloads/$TIMESTAMP"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"

          {
            echo "# 🎵 دانلود موزیک"
            echo ""
            echo "**تاریخ:** $(date '+%Y-%m-%d %H:%M:%S')"
            echo ""
            echo "**جستجو:** ${{ github.event.inputs.query }}"
            echo ""
            echo "**کیفیت:** ${{ github.event.inputs.quality }}"
            echo ""
            echo "---"
            echo ""
            echo "## فایل‌های دانلود شده"
            echo ""
            echo "| نام فایل | حجم | لینک |"
            echo "|----------|------|------|"
            for FILE in "$FOLDER"/*; do
              if [ -f "$FILE" ]; then
                BASENAME=$(basename "$FILE")
                SIZE=$(stat -c%s "$FILE")
                SIZE_MB=$(( SIZE / 1024 / 1024 ))
                ENCODED_FILE=$(echo "$BASENAME" | sed 's/ /%20/g')
                ENCODED_FOLDER=$(echo "$TIMESTAMP" | sed 's/ /%20/g')
                RAW_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/music-downloads/${ENCODED_FOLDER}/${ENCODED_FILE}"
                echo "| \`$BASENAME\` | ${SIZE_MB} MB | [دانلود](${RAW_LINK}) |"
              fi
            done
            echo ""
            echo "---"
            echo "*دانلود خودکار با GitHub Actions و yt-dlp*"
          } > "$FOLDER/README.md"

      - name: Update main README
        run: |
          MAIN_README="music-downloads/README.md"
          mkdir -p music-downloads

          {
            echo "# 🎵 دانلودهای موزیک"
            echo ""
            echo "| تاریخ | پوشه |"
            echo "|--------|------|"
            for DIR in music-downloads/*/; do
              if [ -d "$DIR" ] && [ "${DIR:0:1}" != "." ]; then
                DIRNAME=$(basename "$DIR")
                echo "| $DIRNAME | [مشاهده](./$DIRNAME/) |"
              fi
            done
            echo ""
            echo "---"
            echo "*دانلود خودکار با GitHub Actions*"
          } > "$MAIN_README"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add music-downloads/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add music: ${{ github.event.inputs.query }} [skip ci]"
          git pull --rebase
          git push
