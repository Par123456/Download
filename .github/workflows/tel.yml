name: 📥 Telegram Scraper (No API)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کانال (مثلاً durov)'
        required: true
        type: string
      count:
        description: 'تعداد آخرین پست‌ها'
        required: true
        default: '5'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-pip
          pip3 install requests beautifulsoup4 html2text

      - name: Scrape and download
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
          COUNT: ${{ github.event.inputs.count }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 << 'PYEOF'
          import os, sys, re, time, shutil
          from datetime import datetime
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          import html2text

          # ─── تنظیمات ───
          channel = os.environ['CHANNEL'].strip().replace('@','').replace('https://t.me/s/','').replace('https://t.me/','').rstrip('/')
          count = int(os.environ['COUNT'])
          repo_owner = os.environ['REPO_OWNER']
          repo_name = os.environ['REPO_NAME']
          branch = os.environ['BRANCH']

          BASE_URL = f"https://t.me/s/{channel}"
          DOWNLOAD_DIR = Path('downloads')
          DOWNLOAD_DIR.mkdir(parents=True, exist_ok=True)

          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          }

          print(f"📡 شروع اسکرپینگ از کانال: @{channel}")
          print(f"🔢 تعداد درخواستی: {count}")

          messages = []
          last_id = None
          need = count

          # ─── حلقه صفحه‌بندی ───
          while need > 0:
              url = BASE_URL if not last_id else f"{BASE_URL}?before={last_id}"
              resp = requests.get(url, headers=HEADERS, timeout=20)
              if resp.status_code != 200:
                  print(f"⚠️ خطای HTTP {resp.status_code} – اتمام")
                  break

              soup = BeautifulSoup(resp.text, 'html.parser')
              wraps = soup.select('.tgme_widget_message_wrap')
              if not wraps:
                  print("🚫 هیچ پستی پیدا نشد (کانال خصوصی یا وجود ندارد)")
                  break

              for wrap in wraps:
                  if need <= 0:
                      break
                  msg = wrap.select_one('.tgme_widget_message')
                  if not msg:
                      continue

                  # شناسه پیام
                  data_post = msg.get('data-post', '')
                  if not data_post:
                      continue
                  mid = data_post.split('/')[-1]
                  try:
                      last_id = int(mid)
                  except:
                      continue

                  # متن پیام
                  text_div = msg.select_one('.tgme_widget_message_text')
                  text = ''
                  if text_div:
                      h = html2text.HTML2Text()
                      h.ignore_links = False
                      h.ignore_images = True
                      text = h.handle(str(text_div)).strip()

                  # تاریخ
                  time_tag = msg.select_one('.tgme_widget_message_date time')
                  if time_tag and time_tag.has_attr('datetime'):
                      date_str = time_tag['datetime']
                  else:
                      date_str = datetime.utcnow().isoformat()

                  # مدیاهای موجود
                  media_items = []

                  # عکس‌ها
                  for photo in msg.select('.tgme_widget_message_photo_wrap'):
                      style = photo.get('style', '')
                      url_match = re.search(r"url\(['\"]?(.*?)['\"]?\)", style)
                      if url_match:
                          img_url = url_match.group(1)
                          # تلاش برای کیفیت بالاتر
                          img_url = re.sub(r'(_thumb|_small|_\d+x\d+)', '', img_url)
                          media_items.append(('photo', img_url))

                  # ویدیوها
                  for video in msg.select('.tgme_widget_message_video'):
                      src = video.get('src') or video.get('data-src')
                      if src:
                          media_items.append(('video', src))

                  # اسناد (فایل، صوت، ویس، استیکر و...)
                  for doc in msg.select('.tgme_widget_message_document'):
                      # نوع مدیا از کلاس‌ها
                      classes = doc.get('class', [])
                      if 'message_voice' in classes:
                          dtype = 'voice'
                      elif 'message_audio' in classes:
                          dtype = 'audio'
                      elif 'message_sticker' in classes:
                          dtype = 'sticker'
                      else:
                          dtype = 'document'

                      # لینک دانلود مستقیم (معمولاً در t.me/s برای اسناد وجود ندارد)
                      link = doc.select_one('a')
                      href = link.get('href') if link else ''
                      if href.startswith('https://') or href.startswith('/'):
                          if href.startswith('/'):
                              href = f"https://t.me{href}"
                          media_items.append((dtype, href))
                      else:
                          # بدون لینک مستقیم (مثلاً ویس یا فایل محافظت‌شده)
                          media_items.append((dtype, None))

                  # استیکر (بعضی وقتا کلاس جدا داره)
                  for sticker in msg.select('.tgme_widget_message_sticker'):
                      img = sticker.select_one('img')
                      if img and img.get('src'):
                          media_items.append(('sticker', img['src']))

                  messages.append({
                      'id': mid,
                      'date': date_str,
                      'text': text,
                      'media': media_items
                  })
                  need -= 1

              if len(wraps) < 20:
                  break
              time.sleep(0.6)

          print(f"✅ {len(messages)} پست استخراج شد")

          # ─── ذخیره‌سازی هر پست ───
          post_folders = []

          for msg in messages:
              # ساخت اسم پوشه: تاریخ_ساعت_آیدی
              dt = datetime.fromisoformat(msg['date'].replace('Z','+00:00'))
              safe_date = dt.strftime('%Y-%m-%d_%H%M%S')
              folder_name = f"{safe_date}_{msg['id']}"
              folder_path = DOWNLOAD_DIR / folder_name
              folder_path.mkdir(parents=True, exist_ok=True)
              post_folders.append(folder_name)

              print(f"\n📌 پردازش پست {msg['id']} → {folder_name}")

              # ─── دانلود مدیاها ───
              downloaded_files = []
              for idx, (mtype, murl) in enumerate(msg['media'], start=1):
                  if not murl:
                      # مدیایی که لینک دانلود نداره (مثلاً ویس خصوصی)
                      downloaded_files.append((mtype, None, '⚠️ لینک عمومی ندارد'))
                      print(f"   ❌ {mtype}: بدون لینک عمومی")
                      continue

                  # پسوند فایل
                  ext_map = {
                      'photo': '.jpg',
                      'video': '.mp4',
                      'sticker': '.webp',
                      'voice': '.ogg',
                      'audio': '.mp3',
                      'document': ''
                  }
                  ext = ext_map.get(mtype, '.dat')

                  # تلاش برای یافتن پسوند از لینک
                  if mtype == 'document':
                      # ممکنه لینک به /file/ باشه که پسوند نداره
                      path_part = murl.split('?')[0]
                      _, file_ext = os.path.splitext(path_part)
                      if file_ext:
                          ext = file_ext

                  filename = f"{mtype}_{idx}{ext}"
                  file_path = folder_path / filename

                  print(f"   ⬇️ دانلود {mtype}: {murl[:60]}...")
                  try:
                      dresp = requests.get(murl, headers=HEADERS, timeout=60)
                      if dresp.status_code == 200 and len(dresp.content) > 0:
                          file_path.write_bytes(dresp.content)
                          size_kb = len(dresp.content) // 1024
                          downloaded_files.append((mtype, filename, f'{size_kb} KB'))
                          print(f"   ✅ ذخیره شد: {filename} ({size_kb} KB)")
                      else:
                          # احتمالاً نیاز به لاگین داره (فایل‌های خصوصی)
                          downloaded_files.append((mtype, None, f'خطای HTTP {dresp.status_code}'))
                          print(f"   ⚠️ خطای دانلود: HTTP {dresp.status_code}")
                  except Exception as e:
                      downloaded_files.append((mtype, None, str(e)))
                      print(f"   ❌ خطا: {e}")

                  time.sleep(0.3)

              # ─── ساختن README.md ───
              readme = []
              readme.append(f"# 📬 پست تلگرامی #{msg['id']}")
              readme.append("")
              readme.append("| مشخصات | مقدار |")
              readme.append("|--------|--------|")
              readme.append(f"| تاریخ | {msg['date']} |")
              readme.append(f"| کانال | @{channel} |")
              readme.append(f"| شناسه پیام | {msg['id']} |")
              readme.append("")

              if msg['text']:
                  readme.append("## ✍️ متن پیام")
                  readme.append("")
                  readme.append(msg['text'])
                  readme.append("")

              if downloaded_files:
                  readme.append("## 📎 فایل‌های ضمیمه")
                  readme.append("")
                  readme.append("| نوع | نام فایل | وضعیت / حجم |")
                  readme.append("|-----|----------|-------------|")
                  for mt, fname, status in downloaded_files:
                      if fname:
                          readme.append(f"| {mt} | [{fname}](./{fname}) | {status} |")
                      else:
                          readme.append(f"| {mt} | — | {status} |")
                  readme.append("")
              else:
                  readme.append("## 📎 بدون فایل ضمیمه")
                  readme.append("")

              readme.append("---")
              readme.append(f"*اسکرپ شده توسط [AnishtayiN](https://t.me/AnishtayiN)*")

              (folder_path / "README.md").write_text("\n".join(readme), encoding='utf-8')

          # ─── فایل indexing دانلودها ───
          index_md = DOWNLOAD_DIR / "README.md"
          lines = ["# 📥 دانلودهای اخیر از تلگرام", ""]
          for fname in post_folders:
              fe = fname.replace(' ', '%20')
              lines.append(f"- [{fname}](https://github.com/{repo_owner}/{repo_name}/tree/{branch}/downloads/{fe})")
          lines.append("")
          lines.append("---")
          lines.append("*اسکرپ شده با AnishtayiN Downloader*")
          index_md.write_text("\n".join(lines), encoding='utf-8')

          # ─── به‌روزرسانی README اصلی مخزن ───
          root_readme = Path("README.md")
          if not root_readme.exists():
              root_readme.write_text("# AnishtayiN Telegram Scraper\n", encoding='utf-8')

          content = root_readme.read_text(encoding='utf-8')
          section_title = "📥 آخرین پست‌های دانلود شده از تلگرام"
          marker = f"## {section_title}"
          if marker in content:
              idx = content.index(marker)
              rest = content[idx:]
              next_sep = rest.find("---", len(marker))
              if next_sep != -1:
                  rest = rest[next_sep+3:]
              else:
                  rest = ""
              content = content[:idx] + rest

          post_links = "\n".join(
              f"{i}. [{fn}](https://github.com/{repo_owner}/{repo_name}/tree/{branch}/downloads/{fn.replace(' ', '%20')})"
              for i, fn in enumerate(post_folders, 1)
          )
          new_section = f"""## {section_title}

          {post_links}

          ---
          """
          content = content.strip() + "\n\n" + new_section
          root_readme.write_text(content, encoding='utf-8')

          print("\n🎉 عملیات با موفقیت انجام شد!")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md downloads/
          if [ -z "$(git diff --cached --name-only)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "📥 اسکرپ شدن پست‌های تلگرام [skip ci]"
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
